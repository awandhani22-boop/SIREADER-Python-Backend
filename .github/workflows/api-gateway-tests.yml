name: SIREADER API Gateway Tests

on:
  push:
    branches:
      - phase-3-1-api-gateway
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  api-and-core-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run API tests
        run: |
          pytest -q \
            tests/api/test_config.py \
            tests/api/test_database_lifecycle.py \
            tests/api/test_dependencies_auth.py \
            tests/api/test_security.py \
            tests/api/test_endpoints.py

      - name: Compile API package
        run: |
          python -m compileall -q app/api

      - name: Run core regression tests
        env:
          # Isolated placeholders required by app.config.Settings at import time.
          # These values are not used to connect to PostgreSQL or Telegram.
          DATABASE_URL: postgresql+psycopg://ci:ci@127.0.0.1:5432/ci
          TELEGRAM_API_ID: "1"
          TELEGRAM_API_HASH: "ci-test-placeholder"
          TELEGRAM_TARGET_CHAT_ID: "-1000000000000"
        run: |
          pytest -q test_decision_engine.py test_decision_service.py
