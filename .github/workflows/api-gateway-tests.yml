name: SIREADER API Gateway Tests

on:
  push:
    branches:
      - phase-3-1-api-gateway
      - phase-3-3-sse-implementation
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  api-and-core-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sireader_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sireader_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run API tests
        env:
          # Disposable PostgreSQL service container. Never points to Supabase.
          SIREADER_TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/sireader_ci
        run: |
          pytest -q \
            tests/api/test_config.py \
            tests/api/test_database_lifecycle.py \
            tests/api/test_dependencies_auth.py \
            tests/api/test_security.py \
            tests/api/test_endpoints.py \
            tests/api/test_postgres_privileges.py \
            tests/api/test_event_stream.py \
            tests/api/test_event_migration_postgres.py

      - name: Compile API package
        run: |
          python -m compileall -q app/api

      - name: Run core regression tests
        env:
          # Isolated placeholders required by app.config.Settings at import time.
          # These values are not used to connect to PostgreSQL or Telegram.
          DATABASE_URL: postgresql+psycopg://ci:ci@127.0.0.1:5432/ci
          TELEGRAM_API_ID: "1"
          TELEGRAM_API_HASH: "ci-test-placeholder"
          TELEGRAM_TARGET_CHAT_ID: "-1000000000000"
        run: |
          pytest -q test_decision_engine.py test_decision_service.py
